# OpenWRT Configuration: a subset of router settings I'd like to modify and see at a glance.
# Most of these will be passed to uci, which will then update the final config files under /etc.
# Also includes options for imagebuilder, and other software not managed by uci (like AdGuardHome).
# Required: At least VPN config must be edited with your own values.


# Optional: system settings
system:
  hostname: "travelrouter"
  timezone: "UTC"

# Network interfaces/settings (/etc/config/network)
network:
  wan_iface: eth0            # Wired WAN port
  lan_iface: eth1            # Wired LAN port (bridged into br-lan)
  usb_iface: usb0            # USB tethering (Android RNDIS)
  wifi_uplink_radio: radio0  # Radio used as WAN client (Travelmate)
  wifi_ap_radio: radio1      # Radio used for LAN access point
  lan_ipaddr: "10.8.0.1"
  lan_netmask: "255.255.255.0"

  # Optional: wifi networks (remove if unused)
  # Uplink: WAN client connection via Travelmate
  wifi_uplink:
    ssid: "ssid"
    password: "pass"
    # Reference: https://openwrt.org/docs/guide-user/network/wifi/basic#encryption_modes
    encryption: psk2

  # AP: LAN access point on radio1 (optional)
  wifi_ap:
    ssid: "ssid"
    password: "pass"
    encryption: psk2

  # Wireguard VPN config
  vpn:
    private_key: "privkey"
    address: "10.2.0.2/32"
    dns: "10.2.0.1"
    address_v6: "2a07:b944::2:2/128"  # optional
    dns_v6: "2a07:b944::2:1"  # optional
    mtu: 1380
    peer_public_key: "pubkey"
    peer_endpoint: "vpn.example.com:51820"

# Optional: Dropbear SSH (/etc/config/dropbear)
ssh:
  pubkey: "pubkey"
  port: 22

# Optional: static DHCP leases (/etc/config/dhcp)
dhcp: []
  # - name: hostname
  #   ip: 10.8.0.100
  #   mac: ["AA:BB:CC:DD:EE:FF"]
  #   dns: true          # optional: also publish a DNS record for this host
  #   tags: ["tag"]      # optional: dnsmasq tag(s) for per-tag options/firewall rules

# Optional: Port forwarding firewall rules (/etc/config/firewall)
port_forwards:
  - name: HTTPS
    src_dport: 443
    dest_ip: 10.8.0.100


# AdGuard Home (/etc/adguardhome/adguardhome.yaml)
adguard:
  user: "admin"
  password: "changeme"
  # Custom DNS rewrites (domain: IP)
  dns_rewrites:
    adguard.lan: 10.8.0.1
    openwrt.lan: 10.8.0.1

# BanIP feeds and rules (/etc/config/banip)
# Ref: https://openwrt.org/docs/guide-user/firewall/banip
banip:
  feeds:
    - cinsscore   # Suspicious attacker IPs
    - debl        # fail2ban IP blacklist
    - doh         # Public DoH resolvers (outbound; blocks AdGuard bypass)
    - dshield     # dshield IP blocklist
    - feodo       # Feodo tracker (botnet C2)
    - firehol1    # High-confidence threats
    - threatview  # Active C2/malware IPs
    - tor         # Tor exit nodes
    - turris      # Turris Sentinel (active attackers)
    - country     # Country-based blocking
  countries: [by, cn, ir, kp, ru, tr]

# OpenWRT imagebuilder options (only used at build time)
imagebuilder:

  # Makefile environment variables. Reference:
  # https://openwrt.org/docs/guide-user/additional-software/imagebuilder
  # https://mintlify.wiki/openwrt/openwrt/reference/image-variables
  make_vars:
    CONFIG_TARGET_ROOTFS_EXT4FS: n  # Skip building ext4 images
    CONFIG_TARGET_ROOTFS_SQUASHFS: y
    CONFIG_TARGET_ROOTFS_PARTSIZE: 150  # In MB
    CONFIG_BUSYBOX_CONFIG_FEATURE_EDITING_SAVEHISTORY: y

  # Packages to install
  packages_add:
    # USB + WiFi drivers
    - block-mount
    - kmod-mt76x2u
    - kmod-r8169
    - kmod-usb3
    - kmod-usb2
    - kmod-usb2-pci
    - kmod-usb-net-rndis

    # General LuCI packages
    - luci
    - luci-app-firewall
    - luci-app-package-manager
    - luci-mod-admin-full
    - luci-mod-network
    - luci-mod-status
    - luci-mod-system
    - luci-proto-ipv6
    - luci-ssl
    - luci-theme-material
    - uhttpd
    - uhttpd-mod-ubus

    # Additional applications/services
    - adguardhome
    - banip
    - luci-app-banip
    - mwan3
    - luci-app-mwan3
    - sqm-scripts
    - luci-app-sqm
    - travelmate
    - luci-app-travelmate
    - wireguard-tools
    - luci-proto-wireguard
    - kmod-sched
    - kmod-tcp-bbr
    - kmod-wireguard

    # Misc wireless/security networking tools
    - ca-bundle
    - ca-certificates
    - conntrack
    - iw
    - wireless-tools
    - wpad-openssl

    # CLI utils for admin/setup/testing convenience (not required for router operation)
    - curl
    - fish
    - htop
    - iperf3
    - iputils-ping
    - iputils-tracepath
    - jq
    - netcat
    - pv
    - rsync
    - shadow
    - sudo
    - tcpdump-mini
    - tmux
    - vim-full
    - wget
    - xz
    - xz-utils
    - yq

  # Conflicting packages to remove from base image
  packages_remove:
    - wpad-basic-mbedtls
