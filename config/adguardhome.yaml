theme: dark
language: en

http:
  address: 0.0.0.0:8080

users:
  - name: admin
    # overwritten by config.yml at build time
    password: $2b$10$FrKu0YMMRPnLjqVAB2eZaelhUKkXTqd/nrvg0O7jWfpF3BM69SRe.

dns:
  port: 53
  # Hosts are rewritten on first boot from config.yml
  bind_hosts:
    - 0.0.0.0
    - 192.168.2.1
  allowed_clients:
    - localhost
    - 192.168.2.1/24
  # On first boot, Wireguard VPN will be added as upstream DNS (via VPN_DNS)
  upstream_dns:
    - '[/lan/]127.0.0.1:5353'
    - '[/ighwifi.com/]1.1.1.1'
  bootstrap_dns:
    - 1.1.1.1
    - 1.0.0.1
    - 2606:4700:4700::1111
    - 2606:4700:4700::1001
  upstream_mode: fastest_addr

filtering:
  rewrites:
    - domain: adguard.lan
      answer: 10.8.0.1
      enabled: true
    - domain: openwrt.lan
      answer: 10.8.0.1
      enabled: true
  blocked_services:
    schedule:
      time_zone: UTC

